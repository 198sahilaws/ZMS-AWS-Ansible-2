---
# Minimal 'client' baseline for Linux client-role hosts (role_client): common CLI
# tooling plus the SMB client so they can mount the fileshare. Extend as needed.
#
#   ansible-playbook playbooks/linux-client.yml
#   ansible-playbook playbooks/linux-client.yml --limit client01

- name: Configure Linux client hosts
  # role_client spans Linux and Windows — intersect with os_linux.
  hosts: "{{ target | default('role_client:&os_linux') }}"
  gather_facts: true
  become: true
  vars:
    client_packages: [cifs-utils, curl, vim]
  tasks:
    - name: Install client packages (Debian family)
      ansible.builtin.apt:
        name: "{{ client_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Install client packages (RedHat family)
      ansible.builtin.dnf:
        name: "{{ client_packages }}"
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install client packages (SUSE family)
      community.general.zypper:
        name: "{{ client_packages }}"
        state: present
      when: ansible_facts['os_family'] == "Suse"
