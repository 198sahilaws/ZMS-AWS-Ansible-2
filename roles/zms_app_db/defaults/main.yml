---
zms_app_db_user: zmsapp
zms_app_db_client_pattern: "10.188.%"
zms_app_db_port: 3306

# Where the drop-in config goes, per family. A drop-in rather than an edit of
# the distro's own file: editing my.cnf in place means every distro needs a
# different lineinfile and a package upgrade can clobber it.
zms_app_db_confdir_redhat: /etc/my.cnf.d
zms_app_db_confdir_suse: /etc/my.cnf.d
zms_app_db_confdir_debian: /etc/mysql/mariadb.conf.d

# MariaDB's unix socket differs by family (SLES puts it under /run).
zms_app_db_socket_redhat: /var/lib/mysql/mysql.sock
zms_app_db_socket_suse: /run/mysql/mysql.sock
zms_app_db_socket_debian: /var/run/mysqld/mysqld.sock
