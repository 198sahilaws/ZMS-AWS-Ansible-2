---
# Prepare the database host for the service desk: config drop-in, schema,
# and an application account scoped to this schema only.
#
# The TABLES are not created here — the app role does that, because it has the
# venv, PyMySQL and schema.sql. This role owns the server-side concerns: what
# the server listens on, what the database is called, and who may connect.

- name: Detect which MySQL-family unit this host runs # noqa command-instead-of-module
  # A read-only existence check. The service module would try to START the unit,
  # which is exactly what must not happen before we know it is installed.
  ansible.builtin.command: "systemctl cat {{ item }}.service"
  register: sd_db_units
  changed_when: false
  failed_when: false
  loop:
    - mysql
    - mariadb

- name: Record the unit, config directory and socket for this family
  ansible.builtin.set_fact:
    # Oracle MySQL on Ubuntu is 'mysql'; everything else in this estate is
    # 'mariadb'. Probed rather than mapped from the distro, for the same reason
    # the Python interpreter is probed: a map is wrong the moment an AMI changes.
    sd_db_unit: "{{ 'mysql' if sd_db_units.results[0].rc == 0 else 'mariadb' }}"
    sd_db_confdir: >-
      {{ sd_db_confdir_mysql_debian
         if sd_db_units.results[0].rc == 0
         else (sd_db_confdir_mariadb_redhat if ansible_facts['os_family'] == 'RedHat'
               else sd_db_confdir_mariadb_suse if ansible_facts['os_family'] == 'Suse'
               else sd_db_confdir_mariadb_debian) }}
    sd_db_socket: >-
      {{ sd_db_socket_debian
         if ansible_facts['os_family'] == 'Debian'
         else (sd_db_socket_redhat if ansible_facts['os_family'] == 'RedHat'
               else sd_db_socket_suse) }}

- name: Fail with an actionable message when no MySQL-family server is installed
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} is the service desk database host but has neither
      mysql.service nor mariadb.service. Run the matching distro playbook first
      (playbooks/ubuntu-mysql.yml for this deployment), or point sd_db_group /
      sd_db_distro_group at a different host in vars/servicedesk.yml.
  when:
    - sd_db_units.results[0].rc != 0
    - sd_db_units.results[1].rc != 0

# community.mysql needs a Python MySQL client ON THE MANAGED HOST. ubuntu-mysql.yml
# installs python3-pymysql, but this role must stand alone, so the same
# best-effort-then-pip pattern the other DB roles use — the package is named
# differently on every distro and is absent from some repos.
- name: Check whether the Python MySQL client is importable
  ansible.builtin.command: python3 -c "import pymysql"
  register: sd_pymysql
  changed_when: false
  failed_when: false

- name: Install a Python MySQL client from the distro repos (best effort)
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - python3-pymysql
    - python3-PyMySQL
  failed_when: false
  when: sd_pymysql.rc != 0

- name: Re-check the Python MySQL client
  ansible.builtin.command: python3 -c "import pymysql"
  register: sd_pymysql2
  changed_when: false
  failed_when: false
  when: sd_pymysql.rc != 0

- name: Install PyMySQL from pip as a last resort
  ansible.builtin.pip:
    name: PyMySQL
    state: present
    extra_args: "--break-system-packages"
  failed_when: false
  when:
    - sd_pymysql.rc != 0
    - sd_pymysql2.rc | default(1) != 0

- name: Install the service desk server configuration drop-in
  ansible.builtin.template:
    src: 99-servicedesk.cnf.j2
    dest: "{{ sd_db_confdir }}/99-servicedesk.cnf"
    owner: root
    group: root
    mode: "0644"
  notify: restart sd database

- name: Ensure the database server is running and enabled
  ansible.builtin.service:
    name: "{{ sd_db_unit }}"
    state: started
    enabled: true

# Restart now if the drop-in changed, so the database and grants below are
# created against the server that will actually be serving.
- name: Apply the configuration change before touching schemas
  ansible.builtin.meta: flush_handlers

- name: Create the service desk database
  community.mysql.mysql_db:
    name: "{{ sd_db_name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_user: root
    login_password: "{{ sd_mysql_root_password }}"
    login_unix_socket: "{{ sd_db_socket }}"
    check_implicit_admin: true
  no_log: true

- name: Create the application account, scoped to this schema only
  community.mysql.mysql_user:
    name: "{{ sd_db_user }}"
    host: "{{ sd_db_client_pattern }}"
    password: "{{ sd_db_password }}"
    # mysql_native_password on purpose. MySQL 8 defaults new accounts to
    # caching_sha2_password, which PyMySQL can only complete over a plaintext
    # connection if the `cryptography` package is present — an extra dependency
    # (and a compiled one on some distros) for zero benefit inside a VPC.
    plugin: mysql_native_password
    priv: "{{ sd_db_name }}.*:ALL"
    state: present
    login_user: root
    login_password: "{{ sd_mysql_root_password }}"
    login_unix_socket: "{{ sd_db_socket }}"
    check_implicit_admin: true
  no_log: true

- name: Detect whether firewalld is active # noqa command-instead-of-module
  # No module can ASK whether a unit is active without also trying to manage it.
  # Ubuntu's ufw is inactive and Amazon Linux has no firewalld at all, so this
  # must not assume. Skipping the probe is how a service ends up listening and
  # silently unreachable, which looks exactly like a security group problem.
  ansible.builtin.command: systemctl is-active firewalld
  register: sd_db_firewalld
  changed_when: false
  failed_when: false

- name: Open the database port in firewalld
  ansible.posix.firewalld:
    port: "{{ sd_db_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: sd_db_firewalld.stdout | trim == 'active'

- name: Confirm the server is listening on a non-loopback address
  ansible.builtin.shell: |
    set -o pipefail
    (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | awk '{print $4}' | grep -E ':{{ sd_db_port }}$'
  args:
    executable: /bin/bash
  register: sd_db_listen
  changed_when: false
  failed_when: false

- name: Warn when the server is still bound to loopback only
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} is listening only on loopback
      ({{ sd_db_listen.stdout_lines | default([]) | join(', ') }}). The web host
      will not be able to connect. The drop-in sets bind-address = 0.0.0.0, so
      this usually means the server did not restart — check
      `systemctl status {{ sd_db_unit }}`.
  when: sd_db_listen.stdout_lines | default([]) | select('search', '^0.0.0.0:|^\\*:|^\\[::\\]:') | list | length == 0

- name: Report what was prepared
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ ansible_facts['distribution'] }},
      {{ sd_db_unit }}) serving `{{ sd_db_name }}` to
      '{{ sd_db_user }}'@'{{ sd_db_client_pattern }}'; listening on
      {{ sd_db_listen.stdout_lines | default(['unknown']) | join(', ') }}
