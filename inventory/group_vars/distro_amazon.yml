---
# Login user for Amazon Linux hosts (inventory group distro_amazon, keyed off the
# Distro tag Terraform sets). Amazon Linux has no 'ubuntu' account — the login is
# 'ec2-user'. ansible_user is set directly here (and NOT in os_linux.yml), so this
# is the only group defining it for Amazon hosts and it always wins, with no
# reliance on ansible_group_priority.
ansible_user: ec2-user
