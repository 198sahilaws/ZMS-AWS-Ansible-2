---
# Connection settings for the Linux estate (group 'os_linux', keyed off tag OS).
ansible_connection: ssh
ansible_become: true
ansible_become_method: sudo

# The login user is set PER DISTRO, in inventory/group_vars/distro_amazon.yml
# (ec2-user) and distro_ubuntu.yml (ubuntu). It is deliberately NOT set here:
# defining ansible_user in os_linux too would create a same-level group-var
# conflict that ansible_group_priority does not reliably resolve on ansible-core
# 2.21 (os_linux was winning and every Linux host connected as 'ubuntu', so the
# Amazon Linux hosts failed with publickey). With ansible_user defined ONLY in
# the distro groups, the correct user always wins — no priority needed.
#
# Fallback for a Linux host with NO Distro tag (should not happen; Terraform tags
# every VM): uncomment to default such hosts to ubuntu.
# ansible_user: ubuntu

# --- Private subnets / bastion (optional) ---------------------------------
# If the control node cannot route directly to managed hosts, tunnel SSH
# through a bastion by uncommenting the following and setting bastion_host.
# In the Document 1 topology (control node inside the VPC, 'managed' SG
# allowing its SG) this is NOT needed — direct private addressing works.
#
# ansible_ssh_common_args: >-
#   -o ProxyCommand="ssh -W %h:%p -q ubuntu@{{ bastion_host }}"
